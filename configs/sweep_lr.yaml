program: hw1_main.py
method: bayes
run_cap: 10
metric:
  name: val/loss
  goal: minimize

# Short proxy runs to find the LR elbow cheaply before committing to a full
# 5000-step run at the winning value.
parameters:
  training.max_lr:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-3
  training.num_iters:
    value: 800
  training.cosine_cycle_iters:
    value: 800
  training.warmup_iters:
    value: 40
  training.eval_interval:
    value: 50

early_terminate:
  type: hyperband
  min_iter: 100

command:
  - uv
  - run
  - python
  - ${program}
  - ${args_no_hyphens}

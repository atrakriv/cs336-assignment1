program: hw1_main.py
project: cs336-hw1
method: grid

parameters:
  training.max_lr:
    values: [3e-5, 1e-4, 3e-4, 1e-3, 3e-3, 1e-2]  # last two expected to diverge
  training.num_iters:
    value: 800
  training.cosine_cycle_iters:
    value: 800
  training.warmup_iters:
    value: 40
  training.eval_interval:
    value: 50

command:
  - uv
  - run
  - python
  - ${program}
  - ${args_no_hyphens}

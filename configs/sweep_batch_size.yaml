program: hw1_main.py
project: cs336-hw1
method: grid

parameters:
  training.batch_size:
    values: [1, 32, 64, 128, 256, 512, 1024]
  training.num_iters:
    value: 800
  training.cosine_cycle_iters:
    value: 800
  training.warmup_iters:
    value: 40
  training.eval_interval:
    value: 50

command:
  - uv
  - run
  - python
  - ${program}
  - ${args_no_hyphens}
